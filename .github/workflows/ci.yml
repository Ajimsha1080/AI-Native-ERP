name: CI Quality Gates

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-audit:
    name: Backend Lint, Typecheck & Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pip-audit bandit
          pip install -r requirements.txt

      - name: Ruff Linter Check
        run: |
          ruff check . --ignore E501,F401,B008

      - name: Bandit Security Analysis
        run: |
          bandit -r apps packages -ll -ii

      - name: Python Dependency Audit (CVEs)
        run: |
          pip-audit --desc on

  test-backend:
    name: Backend Pytest, Postgres RLS, Redis & Alembic
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentic_user
          POSTGRES_PASSWORD: agentic_password
          POSTGRES_DB: agentic_platform
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://agentic_user:agentic_password@localhost:5432/agentic_platform
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-at-least-32-chars-long-for-testing
      STRIPE_WEBHOOK_SECRET: whsec_test_secret

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Verify Alembic Migrations
        run: |
          alembic upgrade head
          alembic check

      - name: Run Pytest with Coverage
        run: |
          pytest --cov=apps --cov=packages --cov-report=term-missing --cov-fail-under=75

  frontend-ci:
    name: Next.js Lint, Typecheck, Audit & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install Frontend Dependencies
        run: |
          npm --prefix apps/web ci

      - name: NPM Dependency Audit
        run: |
          npm --prefix apps/web audit --audit-level=high

      - name: Next.js Typecheck & Lint
        run: |
          npx --prefix apps/web tsc --noEmit
          npm --prefix apps/web run lint

      - name: Build Next.js Web App
        run: |
          npm --prefix apps/web run build

  security-scan:
    name: Secret & Container Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Build Docker Image
        run: |
          docker build -t agentic-erp-api:ci .

      - name: Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'agentic-erp-api:ci'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  e2e-docker-compose:
    name: End-to-End Docker Compose Stack & Smoke Test
    runs-on: ubuntu-latest
    needs: [test-backend, frontend-ci]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start Docker Compose Stack
        run: |
          docker compose up -d --wait --build

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Test Dependencies
        run: |
          pip install httpx sqlalchemy asyncpg redis

      - name: Execute End-to-End Critical Path Smoke Test
        run: |
          python scripts/smoke_test.py

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install Playwright & Dependencies
        run: |
          npm --prefix apps/web ci
          npx --prefix apps/web playwright install --with-deps

      - name: Run Playwright E2E Tests (Signup -> Agent Action -> Navigation)
        run: |
          PLAYWRIGHT_TEST_BASE_URL=http://localhost:3000 npx --prefix apps/web playwright test

      - name: Compose Teardown
        if: always()
        run: |
          docker compose down -v
